    BoardShipmentCard:
      type: object
      description: |
        Read-only projection of a shipment for one planning-board card (LOGI-0011 / PRD F11).
        This is a SUBSET of ShipmentResponse, not a second source of truth: every field is copied
        from the same shipment read model that GET /shipments serves, so the board and the shipment
        list can never disagree. atRisk is the read-time BR-2 projection, never stored. routeId is
        null for an unassigned shipment (AC-5) and the UI shows those in the unassigned lane.
      required: [id, referenceCode, status, priority, weightKg, originWarehouseId, destinationAddress, atRisk, createdAt]
      properties:
        id: { type: integer, format: int64, example: 1 }
        referenceCode: { type: string, pattern: '^SHP-[0-9]{6}$', example: SHP-000123 }
        status: { type: string, enum: [Pending, Assigned, InTransit, Delivered, Delayed, Cancelled], example: Pending }
        priority: { type: string, enum: [Standard, Express], example: Standard }
        weightKg: { type: number, example: 1250.5 }
        originWarehouseId: { type: integer, format: int64, example: 1 }
        destinationAddress: { type: string, maxLength: 500, example: '12 Dock Road, Rotterdam' }
        slaDueAt: { type: string, format: date-time, nullable: true, example: 2026-09-20T08:00:00Z }
        routeId: { type: integer, format: int64, nullable: true, example: 7 }
        atRisk: { type: boolean, description: Read-time BR-2 projection, copied from ShipmentResponse., example: false }
        createdAt: { type: string, format: date-time, example: 2026-09-20T06:00:00Z }
    BoardRouteCard:
      type: object
      description: |
        Read-only route summary for the board (LOGI-0011), with the BR-5 capacity projection reused
        from RouteCapacityView by $ref rather than recomputed — one rule, one implementation.
        capacity fields stay null when the route has no vehicle: "no vehicle assigned" is not "full".
      required: [id, name, status, plannedStart, plannedEnd, capacity]
      properties:
        id: { type: integer, format: int64, example: 7 }
        name: { type: string, example: North loop }
        status: { type: string, enum: [Planned, InProgress, Completed, Cancelled], example: Planned }
        vehicleId: { type: integer, format: int64, nullable: true, example: 1 }
        driverId: { type: integer, format: int64, nullable: true, example: 2 }
        plannedStart: { type: string, format: date-time, example: 2026-10-01T08:00:00Z }
        plannedEnd: { type: string, format: date-time, example: 2026-10-01T16:00:00Z }
        capacity: { $ref: '#/components/schemas/RouteCapacityView' }
    BoardColumn:
      type: object
      description: |
        One kanban column: the shipments in exactly one BR-7 status (LOGI-0011 AC-1). All six
        statuses are always present in the server-supplied lifecycle order, including empty ones.
        totalCount is the UNTRUNCATED count for the active filters, while cards is capped by
        maxPerColumn; truncated=true tells the client the column holds more than it returned, so a
        wrong "50 of 312" can never be rendered (AC-8).
      required: [status, totalCount, truncated, cards]
      properties:
        status: { type: string, enum: [Pending, Assigned, InTransit, Delivered, Delayed, Cancelled], example: Pending }
        totalCount: { type: integer, minimum: 0, example: 312 }
        truncated: { type: boolean, example: false }
        cards:
          type: array
          items: { $ref: '#/components/schemas/BoardShipmentCard' }
    BoardFilters:
      type: object
      description: |
        Echo of the filter set the server actually applied (LOGI-0011 AC-3), so the UI can render
        the active filters and restore them from the URL. Absent filters are null, never omitted,
        so the client never has to distinguish "unset" from "not returned".
      properties:
        status: { type: string, nullable: true, enum: [Pending, Assigned, InTransit, Delivered, Delayed, Cancelled], example: Pending }
        priority: { type: string, nullable: true, enum: [Standard, Express], example: Express }
        originWarehouseId: { type: integer, format: int64, nullable: true, example: 1 }
        slaRisk: { type: boolean, nullable: true, example: true }
        routeId: { type: integer, format: int64, nullable: true, example: 7 }
        q: { type: string, nullable: true, example: SHP-000123 }
        sort: { type: string, example: slaDueAt }
        maxPerColumn: { type: integer, minimum: 1, maximum: 200, example: 50 }
    PlanningBoardResponse:
      type: object
      description: |
        Read-only aggregate board (LOGI-0011 / PRD F11): one request returns every kanban column, the
        route cards with their BR-5 capacity bars, the applied filters, and the unassigned backlog
        count. There is no board write in v1 — status transitions and assignments stay on the
        shipment and route surfaces (AC-7).
      required: [generatedAt, appliedFilters, columns, unassignedTotalCount, routes]
      properties:
        generatedAt: { type: string, format: date-time, example: 2026-09-20T08:00:00Z }
        appliedFilters: { $ref: '#/components/schemas/BoardFilters' }
        columns:
          type: array
          description: Exactly six columns, always in BR-7 lifecycle order (LOGI-0011 O2).
          items: { $ref: '#/components/schemas/BoardColumn' }
        unassignedTotalCount:
          type: integer
          minimum: 0
          description: Shipments matching the filters with a null routeId (AC-5).
          example: 12
        routes:
          type: array
          description: Route cards for the routes referenced by the filtered shipments, plus every Planned route.
          items: { $ref: '#/components/schemas/BoardRouteCard' }
