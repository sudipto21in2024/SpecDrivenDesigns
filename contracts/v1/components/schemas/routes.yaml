    RouteRequest:
      type: object
      description: |
        Body of POST /routes and PATCH /routes/{id} (LOGI-0009). Create accepts
        name + plannedStart/plannedEnd window with optional vehicleId/driverId
        (nullable → unassigned lane); plannedEnd must be after plannedStart.
        PATCH accepts any non-empty subset for rename/reschedule/assign/reassign/unassign
        (explicit null unassigns). Server-owned fields — id, status, createdAt, updatedAt —
        are never accepted and are rejected with 400.
      properties:
        name: { type: string, minLength: 1, maxLength: 200, example: North loop }
        plannedStart: { type: string, format: date-time, example: 2026-10-01T08:00:00Z }
        plannedEnd: { type: string, format: date-time, example: 2026-10-01T16:00:00Z }
        vehicleId: { type: integer, format: int64, nullable: true, minimum: 1, example: 1 }
        driverId: { type: integer, format: int64, nullable: true, minimum: 1, example: 2 }
      required: [name, plannedStart, plannedEnd]
    RouteUpdateRequest:
      type: object
      description: |
        Body of PATCH /routes/{id} (LOGI-0009). Partial update of a Planned route only:
        send only the fields to change; explicit null on vehicleId/driverId unassigns.
        Non-Planned routes are rejected with 409 and nothing is written.
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 200, example: North loop }
        plannedStart: { type: string, format: date-time, example: 2026-10-01T08:00:00Z }
        plannedEnd: { type: string, format: date-time, example: 2026-10-01T16:00:00Z }
        vehicleId: { type: integer, format: int64, nullable: true, minimum: 1, example: 1 }
        driverId: { type: integer, format: int64, nullable: true, minimum: 1, example: 2 }
    RouteResponse:
      type: object
      required: [id, name, plannedStart, plannedEnd, status, createdAt]
      properties:
        id: { type: integer, format: int64, example: 1 }
        name: { type: string, example: North loop }
        plannedStart: { type: string, format: date-time, example: 2026-10-01T08:00:00Z }
        plannedEnd: { type: string, format: date-time, example: 2026-10-01T16:00:00Z }
        vehicleId: { type: integer, format: int64, nullable: true, example: 1 }
        driverId: { type: integer, format: int64, nullable: true, example: 2 }
        status: { type: string, enum: [Planned, InProgress, Completed, Cancelled], example: Planned }
        createdAt: { type: string, format: date-time, example: 2026-09-26T08:00:00Z }
        updatedAt: { type: string, format: date-time, nullable: true, example: 2026-09-26T09:00:00Z }
    PagedResponse:
      type: object
      description: Envelope for all list endpoints (max pageSize 100, default 25).
      required: [items, page, pageSize, totalCount, totalPages]
      properties:
        items:
          type: array
          items: {}
          description: Array of resource objects (schema defined per endpoint).
        page: { type: integer, minimum: 1, default: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100, default: 25 }
        totalCount: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    AssignShipmentToRouteRequest:
      type: object
      description: |
        Assigns one shipment to a route (LOGI-0010 / PRD F10). The shipment must exist and be
        Pending, the route must be Planned, and the route's assigned vehicle must have enough
        remaining capacity (BR-5). On success the shipment's routeId is set and its status
        auto-transitions Pending -> Assigned in the same transaction, appending one
        shipment_status_history row. Re-assigning a shipment that is already on THIS route is an
        idempotent no-op; moving it to a different route is 409 (unassign first).
      required: [shipmentId]
      additionalProperties: false
      properties:
        shipmentId: { type: integer, format: int64, minimum: 1, example: 42 }
    RouteCapacityView:
      type: object
      description: |
        Read-only BR-5 capacity projection for a route's assigned shipments (LOGI-0010).
        capacityKg / vehicleId / remainingCapacityKg are null when the route has no vehicle
        assigned — a route with an unknown capacity is not "full", and 0 would read as full.
        remainingCapacityKg is negative-safe: it is never negative because an over-capacity
        assignment is rejected, not persisted.
      required: [assignedWeightKg, shipmentCount]
      properties:
        vehicleId: { type: integer, format: int64, nullable: true, example: 1 }
        capacityKg: { type: number, format: double, nullable: true, example: 12000 }
        assignedWeightKg: { type: number, format: double, minimum: 0, example: 9000 }
        remainingCapacityKg: { type: number, format: double, nullable: true, example: 3000 }
        shipmentCount: { type: integer, minimum: 0, example: 3 }
    RouteShipmentsPage:
      type: object
      description: Paged envelope for GET /routes/{id}/shipments plus the BR-5 capacity projection.
      required: [items, page, pageSize, totalCount, totalPages, capacity]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ShipmentResponse' }
        page: { type: integer, minimum: 1, default: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100, default: 25 }
        totalCount: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
        capacity: { $ref: '#/components/schemas/RouteCapacityView' }

