openapi: 3.1.0
info:
  title: LogiFlow API
  version: 1.0.0
  description: |
    LogiFlow logistics management API. Single source of truth for backend and frontend.
    Base path: /api/v1
  contact:
    name: LogiFlow
    url: https://logiflow.dev
  license:
    name: Proprietary
servers:
  - url: https://localhost:5001/api/v1
    description: Local development
  - url: https://logiflow.example.com/api/v1
    description: Production (single-node v1)
tags:
  - { name: System, description: Health and metadata }
  - { name: Auth, description: Authentication and token management }
  - { name: Warehouses, description: Warehouse master data }
  - { name: Vehicles, description: Vehicle master data }
  - { name: Drivers, description: Driver master data }
  - { name: Shipments, description: Shipment lifecycle }
  - { name: Routes, description: Route planning and assignment }
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Issue via POST /auth/login. Required on every endpoint except
        /auth/login and /auth/refresh.
  schemas:
    HealthResponse:
      type: object
      properties:
        status: { type: string, example: ok }
        service: { type: string, example: LogiFlow }
        timestamp: { type: string, format: date-time, example: 2026-09-18T00:00:00Z }
      required: [status, service, timestamp]
    ProblemDetails:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri, example: https://logiflow.dev/errors/validation }
        title: { type: string, example: Validation failed }
        status: { type: integer, format: int32, example: 400 }
        detail: { type: string, nullable: true }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
        traceId: { type: string, nullable: true, example: "00-abc123" }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 256, example: dana@logiflow.dev }
        password: { type: string, format: password, minLength: 1, maxLength: 128 }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 1 }
    AuthUser:
      type: object
      description: Identity of an authenticated user. Never carries credential material (no hash, no stamp, no token).
      required: [id, email, fullName, role]
      properties:
        id: { type: integer, format: int64, example: 2 }
        email: { type: string, format: email, example: dana@logiflow.dev }
        fullName: { type: string, example: Dana Doolittle }
        role:
          type: string
          enum: [Admin, Dispatcher, Driver, Viewer]
          example: Dispatcher
    TokenResponse:
      type: object
      required: [accessToken, refreshToken, expiresIn, user]
      properties:
        accessToken:
          type: string
          description: Signed JWT bearer token (lifetime = expiresIn seconds).
        refreshToken:
          type: string
          description: Opaque, single-use rotating refresh token. Consumed and replaced by POST /auth/refresh.
        expiresIn:
          type: integer
          format: int32
          description: Access token lifetime in seconds.
          example: 900
        user: { $ref: '#/components/schemas/AuthUser' }
    WarehouseRequest:
      type: object
      required: [name, address]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: Central DC
        address:
          type: string
          minLength: 1
          maxLength: 500
          example: 12 Industrial Rd, Rotterdam
        latitude: { type: number, format: double, minimum: -90, maximum: 90, example: 51.9244 }
        longitude: { type: number, format: double, minimum: -180, maximum: 180, example: 4.4777 }
    WarehouseResponse:
      type: object
      required: [id, name, address, createdAt]
      properties:
        id: { type: integer, format: int64, example: 1 }
        name: { type: string, example: Central DC }
        address: { type: string, example: 12 Industrial Rd, Rotterdam }
        latitude: { type: number, format: double, nullable: true, example: 51.9244 }
        longitude: { type: number, format: double, nullable: true, example: 4.4777 }
        createdAt: { type: string, format: date-time, example: 2026-09-18T08:00:00Z }
    VehicleRequest:
      type: object
      required: [plateNumber, type, capacityKg]
      properties:
        plateNumber:
          type: string
          minLength: 1
          maxLength: 20
          example: RT-8421-X
        type:
          type: string
          enum: [Van, Truck, Trailer]
          example: Truck
        capacityKg:
          type: number
          format: double
          exclusiveMinimum: 0
          example: 12000
        status:
          type: string
          enum: [Available, InRoute, Maintenance]
          default: Available
          example: Available
    VehicleResponse:
      type: object
      required: [id, plateNumber, type, capacityKg, status, createdAt]
      properties:
        id: { type: integer, format: int64, example: 1 }
        plateNumber: { type: string, example: RT-8421-X }
        type: { type: string, enum: [Van, Truck, Trailer], example: Truck }
        capacityKg: { type: number, format: double, example: 12000 }
        status: { type: string, enum: [Available, InRoute, Maintenance], example: Available }
        createdAt: { type: string, format: date-time, example: 2026-09-20T00:00:00Z }
    DriverRequest:
      type: object
      required: [fullName, licenseNumber]
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 200
          example: Raj Patil
        licenseNumber:
          type: string
          minLength: 1
          maxLength: 40
          example: DL-112-4589
        phone:
          type: string
          maxLength: 40
          example: "+31 6 1234 5678"
        status:
          type: string
          enum: [Active, OffDuty, Suspended]
          default: Active
          example: Active
        userId:
          type: integer
          format: int64
          description: Optional link to a login user account (users.id). The user must exist and may be linked to at most one driver (User 1---1 Driver).
          example: 7
    DriverResponse:
      type: object
      description: Driver master data. Deliberately carries no createdAt — the approved schema §drivers defines no created_at column.
      required: [id, fullName, licenseNumber, status]
      properties:
        id: { type: integer, format: int64, example: 1 }
        userId: { type: integer, format: int64, nullable: true, example: 7 }
        fullName: { type: string, example: Raj Patil }
        licenseNumber: { type: string, example: DL-112-4589 }
        phone: { type: string, nullable: true, example: "+31 6 1234 5678" }
        status: { type: string, enum: [Active, OffDuty, Suspended], example: Active }
    StatusTransitionRequest:
      type: object
      description: Body of POST /shipments/{id}/status-transitions. Legal transitions only (BR-7) — illegal transitions are rejected server-side with 409.
      required: [toStatus]
      properties:
        toStatus:
          type: string
          enum: [Pending, Assigned, InTransit, Delivered, Delayed, Cancelled]
          example: Assigned
        note:
          type: string
          maxLength: 500
          nullable: true
          description: Optional free-text reason recorded in the audit trail.
          example: Loaded onto vehicle RT-8421-X
    ShipmentStatusEvent:
      type: object
      description: One entry of the shipment audit trail (shipment_status_history). Immutable, append-only.
      required: [id, toStatus, changedByUserId, changedAt]
      properties:
        id: { type: integer, format: int64, example: 42 }
        fromStatus:
          type: string
          enum: [Pending, Assigned, InTransit, Delivered, Delayed, Cancelled]
          nullable: true
          description: null on the initial entry.
          example: Pending
        toStatus: { type: string, enum: [Pending, Assigned, InTransit, Delivered, Delayed, Cancelled], example: Assigned }
        changedByUserId: { type: integer, format: int64, example: 7 }
        changedAt: { type: string, format: date-time, example: 2026-09-22T08:00:00Z }
        note: { type: string, nullable: true, maxLength: 500, example: Loaded onto vehicle RT-8421-X }
    PagedResponse:
      type: object
      description: Envelope for all list endpoints (max pageSize 100, default 25).
      required: [items, page, pageSize, totalCount, totalPages]
      properties:
        items:
          type: array
          items: {}
          description: Array of resource objects (schema defined per endpoint).
        page: { type: integer, minimum: 1, default: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100, default: 25 }
        totalCount: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
  responses:
    ValidationProblem:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Forbidden:
      description: Authenticated but not authorized for this role/resource
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    NotFound:
      description: The requested resource does not exist
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Conflict:
      description: Conflicting state — e.g. a unique constraint violation or a referenced resource
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
  # Conventions per 05-api-contract-standards.md §Auth + §Status transitions
  x-role-sets:
    Admin: [Admin]
    Dispatcher: [Dispatcher]
    Driver: [Driver]
    Viewer: [Viewer]
  x-conventions:
    resource-naming: plural nouns
    status-transitions: POST /{resource}/{id}/status-transitions with { "toStatus":"...", "note":"..." }
paths:
  /health:
    get:
      tags: [System]
      summary: Service health
      description: Liveness probe used by CI, Playwright webServer readiness checks, and container orchestration.
      security: []
      operationId: getHealth
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
  /warehouses:
    get:
      tags: [Warehouses]
      summary: List warehouses (paged)
      description: >
        Returns a paged list of warehouses. Query params: page (default 1),
        pageSize (default 25, max 100), q (name contains, case-insensitive).
      x-roles: [Admin, Dispatcher, Viewer]
      operationId: listWarehouses
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1, minimum: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 25, minimum: 1, maximum: 100 } }
        - { name: q, in: query, description: "Filter by name (contains, case-insensitive)", schema: { type: string } }
      responses:
        "200":
          description: Paged warehouse list
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/PagedResponse' }
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/WarehouseResponse' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Warehouses]
      summary: Create warehouse
      description: Creates a warehouse. Name and address are required; coordinates optional but range-validated.
      x-roles: [Admin, Dispatcher]
      operationId: createWarehouse
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarehouseRequest' }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehouseResponse' }
        "400": { $ref: '#/components/responses/ValidationProblem' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
  /warehouses/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [Warehouses]
      summary: Get warehouse by id
      description: Returns a single warehouse. Responds 404 when the id does not exist.
      x-roles: [Admin, Dispatcher, Viewer]
      operationId: getWarehouse
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehouseResponse' }
        "404": { $ref: '#/components/responses/NotFound' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Warehouses]
      summary: Update warehouse (full update)
      description: Replaces name, address and coordinates. Responds 404 when the id does not exist.
      x-roles: [Admin, Dispatcher]
      operationId: updateWarehouse
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarehouseRequest' }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehouseResponse' }
        "400": { $ref: '#/components/responses/ValidationProblem' }
        "404": { $ref: '#/components/responses/NotFound' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Warehouses]
      summary: Delete warehouse
      description: Hard delete in v1 (no soft-delete column). Later restricted once shipments reference warehouses.
      x-roles: [Admin]
      operationId: deleteWarehouse
      responses:
        "204": { description: Deleted }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
  /vehicles:
    get:
      tags: [Vehicles]
      summary: List vehicles (paged)
      description: >
        Returns a paged list of vehicles. Query params: page (default 1),
        pageSize (default 25, max 100), q (plate number contains, case-insensitive),
        status (Available/InRoute/Maintenance), type (Van/Truck/Trailer).
      x-roles: [Admin, Dispatcher, Viewer]
      operationId: listVehicles
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1, minimum: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 25, minimum: 1, maximum: 100 } }
        - { name: q, in: query, description: "Filter by plate number (contains, case-insensitive)", schema: { type: string } }
        - { name: status, in: query, description: "Filter by status", schema: { type: string, enum: [Available, InRoute, Maintenance] } }
        - { name: type, in: query, description: "Filter by vehicle type", schema: { type: string, enum: [Van, Truck, Trailer] } }
      responses:
        "200":
          description: Paged vehicle list
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/PagedResponse' }
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/VehicleResponse' }
        "400": { $ref: '#/components/responses/ValidationProblem' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Vehicles]
      summary: Create vehicle
      description: Creates a vehicle. Plate number, type and a positive capacityKg are required; status defaults to Available. Duplicate plate numbers are rejected with 409.
      x-roles: [Admin, Dispatcher]
      operationId: createVehicle
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VehicleRequest' }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VehicleResponse' }
        "400": { $ref: '#/components/responses/ValidationProblem' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "409": { $ref: '#/components/responses/Conflict' }
  /vehicles/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [Vehicles]
      summary: Get vehicle by id
      description: Returns a single vehicle. Responds 404 when the id does not exist.
      x-roles: [Admin, Dispatcher, Viewer]
      operationId: getVehicle
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VehicleResponse' }
        "404": { $ref: '#/components/responses/NotFound' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Vehicles]
      summary: Update vehicle (full update)
      description: Replaces plate number, type, capacity and status. Responds 404 when the id does not exist, 409 when the plate number collides with another vehicle.
      x-roles: [Admin, Dispatcher]
      operationId: updateVehicle
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VehicleRequest' }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VehicleResponse' }
        "400": { $ref: '#/components/responses/ValidationProblem' }
        "404": { $ref: '#/components/responses/NotFound' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "409": { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Vehicles]
      summary: Delete vehicle
      description: Hard delete in v1 (no soft-delete column). Responds 409 when the vehicle is referenced by a route (routes arrive in LOGI-0009).
      x-roles: [Admin]
      operationId: deleteVehicle
      responses:
        "204": { description: Deleted }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }
  /drivers:
    get:
      tags: [Drivers]
      summary: List drivers (paged)
      description: >
        Returns a paged list of drivers. Query params: page (default 1),
        pageSize (default 25, max 100), q (full name contains, case-insensitive),
        status (Active/OffDuty/Suspended).
      x-roles: [Admin, Dispatcher, Viewer]
      operationId: listDrivers
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1, minimum: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 25, minimum: 1, maximum: 100 } }
        - { name: q, in: query, description: "Filter by full name (contains, case-insensitive)", schema: { type: string } }
        - { name: status, in: query, description: "Filter by status", schema: { type: string, enum: [Active, OffDuty, Suspended] } }
      responses:
        "200":
          description: Paged driver list
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/PagedResponse' }
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/DriverResponse' }
        "400": { $ref: '#/components/responses/ValidationProblem' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Drivers]
      summary: Create driver
      description: >
        Creates a driver. fullName and licenseNumber are required; status defaults to Active.
        licenseNumber must be unique (409). userId optionally links a login user account —
        the user must exist (400) and may be linked to at most one driver (409).
      x-roles: [Admin, Dispatcher]
      operationId: createDriver
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DriverRequest' }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverResponse' }
        "400": { $ref: '#/components/responses/ValidationProblem' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "409": { $ref: '#/components/responses/Conflict' }
  /drivers/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [Drivers]
      summary: Get driver by id
      description: Returns a single driver. Responds 404 when the id does not exist.
      x-roles: [Admin, Dispatcher, Viewer]
      operationId: getDriver
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverResponse' }
        "404": { $ref: '#/components/responses/NotFound' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Drivers]
      summary: Update driver (full update)
      description: >
        Replaces full name, license number, phone, status and the optional user link.
        Responds 404 when the id does not exist, 409 when the license number collides with
        another driver or the target user is already linked to another driver.
      x-roles: [Admin, Dispatcher]
      operationId: updateDriver
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DriverRequest' }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverResponse' }
        "400": { $ref: '#/components/responses/ValidationProblem' }
        "404": { $ref: '#/components/responses/NotFound' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "409": { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Drivers]
      summary: Delete driver
      description: Hard delete in v1 (no soft-delete column). Responds 409 when the driver is referenced by a route (routes arrive in LOGI-0009).
      x-roles: [Admin]
      operationId: deleteDriver
      responses:
        "204": { description: Deleted }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }
  /shipments/{id}/status-transitions:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      tags: [Shipments]
      summary: Transition shipment status (BR-7 state machine)
      description: |
        Moves a shipment to toStatus and appends an immutable entry to the audit trail
        (shipment_status_history) in one transaction. BR-7 legal transitions only:
          Pending → Assigned → InTransit → Delivered
          Pending → Cancelled, Assigned → Cancelled
          InTransit → Delayed, Delayed → InTransit
        Any other transition is rejected with 409; the ProblemDetails detail names the
        legal next state(s). No history row is written for rejected attempts.
        Note: the Driver role is declared here per BR-6 (own-route shipments only);
        ownership scoping is enforced from LOGI-0009/0010.
      x-roles: [Admin, Dispatcher, Driver]
      operationId: createShipmentStatusTransition
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatusTransitionRequest' }
      responses:
        "200":
          description: Transitioned — the recorded audit event is returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShipmentStatusEvent' }
        "400": { $ref: '#/components/responses/ValidationProblem' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }
  /shipments/{id}/status-history:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [Shipments]
      summary: Shipment status audit trail (paged, oldest first)
      description: >
        Returns the append-only status history of a shipment ordered oldest → newest.
        Responds 404 when the shipment id does not exist.
      x-roles: [Admin, Dispatcher, Driver, Viewer]
      operationId: listShipmentStatusHistory
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1, minimum: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 25, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: Paged history (oldest first)
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/PagedResponse' }
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/ShipmentStatusEvent' }
        "400": { $ref: '#/components/responses/ValidationProblem' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
  /auth/login:
    post:
      tags: [Auth]
      summary: Issue access + refresh tokens
      description: >
        Authenticates an email/password pair and returns a short-lived access token plus a
        single-use refresh token. Anonymous endpoint. Invalid credentials return 401 without
        revealing whether the email exists (BR-driven anti-enumeration).
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        "200":
          description: Tokens issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        "400": { $ref: '#/components/responses/ValidationProblem' }
        "401": { $ref: '#/components/responses/Unauthorized' }
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate refresh token
      description: >
        Exchanges a valid refresh token for a NEW access token and a NEW refresh token. The
        presented token is revoked in the same operation (rotation), so replaying it fails with
        401. Anonymous endpoint — the refresh token itself is the credential.
      security: []
      operationId: refresh
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        "200":
          description: New token pair issued; the presented refresh token is revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        "400": { $ref: '#/components/responses/ValidationProblem' }
        "401": { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke a refresh token
      description: >
        Revokes the supplied refresh token so it can never be exchanged again. Idempotent from the
        caller's perspective: returns 204 and does not disclose whether the token existed.
      security: []
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        "204": { description: Refresh token revoked (or already unusable) }
        "400": { $ref: '#/components/responses/ValidationProblem' }
  /auth/me:
    get:
      tags: [Auth]
      summary: Current authenticated user
      description: >
        Returns the identity carried by the presented access token. Used by the SPA on start-up to
        restore session state and decide which UI affordances to render for the user's role.
      operationId: getCurrentUser
      x-roles: [Admin, Dispatcher, Driver, Viewer]
      responses:
        "200":
          description: Authenticated user's identity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthUser' }
        "401": { $ref: '#/components/responses/Unauthorized' }
security:
  - BearerAuth: []
