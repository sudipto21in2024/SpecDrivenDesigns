        Base status-bucket utilization for a fleet resource (LOGI-0012 AC-4/AC-5, O3). v1 has no shift or
        duty-hour data, so "utilization" is deliberately the honest count over the schema's own status
        enum plus a derived percent — never a percentage of hours worked. Bucket keys are the exact
        enum values of the underlying resource, and a bucket that is not available capacity
        (Maintenance, Suspended) is never folded into an "available" number.
        VehicleUtilization and DriverUtilization both build on this shape via allOf, so the bucket and
        percent semantics have exactly one definition in the contract.
      required: [totalCount, utilizationPercent]
      properties:
        totalCount: { type: integer, minimum: 0, example: 12 }
        byStatus:
          type: object
          description: Count per resource status. Buckets with zero members are present with 0.
          additionalProperties: { type: integer, minimum: 0 }
          example: { Available: 4, InRoute: 6, Maintenance: 2 }
        utilizationPercent:
          type: number
          nullable: true
          minimum: 0
          maximum: 100
          description: The in-use share as a percentage, or null when the denominator is 0 — an empty fleet is "no capacity", never "0% used".
          example: 50.0
    VehicleUtilization:
      allOf:
        - $ref: '#/components/schemas/ResourceUtilization'
        - type: object
          description: |
            Fleet utilization snapshot (LOGI-0012 AC-4, PRD F14 "available vs in-route"). Adds the
            capacity-weighted view on top of the bucket counts: inUseCapacityKg sums only the InRoute
            vehicles, so a vehicle in Maintenance is never counted as available capacity.
            capacityUtilizationPercent is null when totalCapacityKg is 0.
          required: [inUseCapacityKg, totalCapacityKg, capacityUtilizationPercent]
          properties:
            inUseCapacityKg: { type: number, minimum: 0, description: Summed capacityKg of the InRoute vehicles only., example: 14500 }
            totalCapacityKg: { type: number, minimum: 0, example: 30000 }
            capacityUtilizationPercent: { type: number, nullable: true, minimum: 0, maximum: 100, description: inUseCapacityKg over totalCapacityKg, or null when totalCapacityKg is 0., example: 48.33 }
    DriverUtilization:
      allOf:
        - $ref: '#/components/schemas/ResourceUtilization'
        - type: object
          description: |
            Driver pool utilization snapshot (LOGI-0012 AC-5, PRD F14 "off-duty"). Same construction as
            ResourceUtilization over the driver status enum; a Suspended driver is never counted as
            available capacity.
          properties: {}
    AtRiskShipmentPage:
      type: object
      description: |
        The SLA-at-risk page carried by the dashboard (LOGI-0012 AC-2/AC-3). It uses the standard
        paging envelope field-for-field — page, pageSize, totalCount, totalPages — so the manager UI
        reuses its existing list pager, but the items are the at-risk projection rows rather than the
        full shipment shape. totalCount is by construction the same number as DashboardResponse's
        atRiskTotalCount, because both come from one query at one captured instant.
      required: [items, page, pageSize, totalCount, totalPages]
      properties:
        items:
          type: array
          description: One page of at-risk shipments, sorted by slaDueAt ascending with id ascending as the tiebreak.
          items: { $ref: '#/components/schemas/DashboardAtRiskShipment' }
        page: { type: integer, minimum: 1, example: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100, example: 20 }
        totalCount: { type: integer, minimum: 0, example: 7 }
        totalPages: { type: integer, minimum: 0, example: 1 }
    DashboardResponse:
      type: object
      description: |
        Read-only operations dashboard (LOGI-0012 / PRD F14, BRD BO-2). One request returns the counts
        by status, the SLA-at-risk list and the vehicle/driver utilization snapshot, so the manager
        landing page issues a single call instead of a fan-out (PRD §5.3). Everything is evaluated at
        ONE captured instant, exposed as generatedAt, so atRiskTotalCount is by construction the
        totalCount of the at-risk page it carries (AC-3) and no row is filtered by a different `now`.
        Nothing is persisted: the at-risk flag is the read-time BR-2 projection exactly as
        BR-sla-rules.md rule 2.5 requires, and there is no dashboard write in v1.
      required: [generatedAt, statusCounts, atRiskTotalCount, atRiskShipments, vehicleUtilization, driverUtilization]
      properties:
        generatedAt: { type: string, format: date-time, description: The single instant every count, row and percentage in this response was evaluated at., example: 2026-09-20T08:00:00Z }
        appliedFilters:
          type: object
          description: Echo of the filter set the server actually applied, so the UI can render and restore the active filters; every dashboard filter is also a GET /shipments filter (AC-6).
          additionalProperties: true
        statusCounts:
          type: array
          description: Exactly six entries, always in BR-7 lifecycle order, zero counts included (AC-1).
          items: { $ref: '#/components/schemas/StatusCount' }
        atRiskTotalCount:
          type: integer
          minimum: 0
          description: Number of shipments matching the BR-2 at-risk projection for the active filters; equals the at-risk page totalCount (AC-3).
          example: 7
        atRiskShipments:
          $ref: '#/components/schemas/AtRiskShipmentPage'
        vehicleUtilization: { $ref: '#/components/schemas/VehicleUtilization' }
        driverUtilization: { $ref: '#/components/schemas/DriverUtilization' }
  responses:
    ValidationProblem:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Forbidden:
      description: Authenticated but not authorized for this role/resource
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    NotFound:
      description: The requested resource does not exist
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
    Conflict:
      description: Conflicting state — e.g. a unique constraint violation or a referenced resource
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
  # Conventions per 05-api-contract-standards.md §Auth + §Status transitions
  x-role-sets:
    Admin: [Admin]
    Dispatcher: [Dispatcher]
    Driver: [Driver]
    Viewer: [Viewer]
  x-conventions:
    resource-naming: plural nouns
    status-transitions: POST /{resource}/{id}/status-transitions with { "toStatus":"...", "note":"..." }
paths:
  /health:
    get:
      tags: [System]
      summary: Service health
      description: Liveness probe used by CI, Playwright webServer readiness checks, and container orchestration.
      security: []
      operationId: getHealth
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthResponse' }
  /warehouses:
    get:
      tags: [Warehouses]
      summary: List warehouses (paged)
      description: >
        Returns a paged list of warehouses. Query params: page (default 1),
        pageSize (default 25, max 100), q (name contains, case-insensitive).
      x-roles: [Admin, Dispatcher, Viewer]
      operationId: listWarehouses
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1, minimum: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 25, minimum: 1, maximum: 100 } }
        - { name: q, in: query, description: "Filter by name (contains, case-insensitive)", schema: { type: string } }
      responses:
        "200":
          description: Paged warehouse list
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/PagedResponse' }
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/WarehouseResponse' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Warehouses]
      summary: Create warehouse
      description: Creates a warehouse. Name and address are required; coordinates optional but range-validated.
      x-roles: [Admin, Dispatcher]
      operationId: createWarehouse
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarehouseRequest' }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehouseResponse' }
        "400": { $ref: '#/components/responses/ValidationProblem' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
  /warehouses/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [Warehouses]
      summary: Get warehouse by id
      description: Returns a single warehouse. Responds 404 when the id does not exist.
      x-roles: [Admin, Dispatcher, Viewer]
      operationId: getWarehouse
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehouseResponse' }
        "404": { $ref: '#/components/responses/NotFound' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Warehouses]
      summary: Update warehouse (full update)
      description: Replaces name, address and coordinates. Responds 404 when the id does not exist.
      x-roles: [Admin, Dispatcher]
      operationId: updateWarehouse
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WarehouseRequest' }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WarehouseResponse' }
        "400": { $ref: '#/components/responses/ValidationProblem' }
        "404": { $ref: '#/components/responses/NotFound' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Warehouses]
      summary: Delete warehouse
      description: Hard delete in v1 (no soft-delete column). Later restricted once shipments reference warehouses.
      x-roles: [Admin]
      operationId: deleteWarehouse
      responses:
        "204": { description: Deleted }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
  /vehicles:
    get:
      tags: [Vehicles]
      summary: List vehicles (paged)
      description: >
        Returns a paged list of vehicles. Query params: page (default 1),
        pageSize (default 25, max 100), q (plate number contains, case-insensitive),
        status (Available/InRoute/Maintenance), type (Van/Truck/Trailer).
      x-roles: [Admin, Dispatcher, Viewer]
      operationId: listVehicles
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1, minimum: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 25, minimum: 1, maximum: 100 } }
        - { name: q, in: query, description: "Filter by plate number (contains, case-insensitive)", schema: { type: string } }
        - { name: status, in: query, description: "Filter by status", schema: { type: string, enum: [Available, InRoute, Maintenance] } }
        - { name: type, in: query, description: "Filter by vehicle type", schema: { type: string, enum: [Van, Truck, Trailer] } }
      responses:
        "200":
          description: Paged vehicle list
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/PagedResponse' }
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/VehicleResponse' }
        "400": { $ref: '#/components/responses/ValidationProblem' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Vehicles]
      summary: Create vehicle
      description: Creates a vehicle. Plate number, type and a positive capacityKg are required; status defaults to Available. Duplicate plate numbers are rejected with 409.
      x-roles: [Admin, Dispatcher]
      operationId: createVehicle
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VehicleRequest' }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VehicleResponse' }
        "400": { $ref: '#/components/responses/ValidationProblem' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "409": { $ref: '#/components/responses/Conflict' }
  /vehicles/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [Vehicles]
      summary: Get vehicle by id
      description: Returns a single vehicle. Responds 404 when the id does not exist.
      x-roles: [Admin, Dispatcher, Viewer]
      operationId: getVehicle
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VehicleResponse' }
        "404": { $ref: '#/components/responses/NotFound' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Vehicles]
      summary: Update vehicle (full update)
      description: Replaces plate number, type, capacity and status. Responds 404 when the id does not exist, 409 when the plate number collides with another vehicle.
      x-roles: [Admin, Dispatcher]
      operationId: updateVehicle
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VehicleRequest' }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VehicleResponse' }
        "400": { $ref: '#/components/responses/ValidationProblem' }
        "404": { $ref: '#/components/responses/NotFound' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "409": { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Vehicles]
      summary: Delete vehicle
      description: Hard delete in v1 (no soft-delete column). Responds 409 when the vehicle is referenced by a route (routes arrive in LOGI-0009).
      x-roles: [Admin]
      operationId: deleteVehicle
      responses:
        "204": { description: Deleted }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }
  /drivers:
    get:
      tags: [Drivers]
      summary: List drivers (paged)
      description: >
        Returns a paged list of drivers. Query params: page (default 1),
        pageSize (default 25, max 100), q (full name contains, case-insensitive),
        status (Active/OffDuty/Suspended).
      x-roles: [Admin, Dispatcher, Viewer]
      operationId: listDrivers
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1, minimum: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 25, minimum: 1, maximum: 100 } }
        - { name: q, in: query, description: "Filter by full name (contains, case-insensitive)", schema: { type: string } }
        - { name: status, in: query, description: "Filter by status", schema: { type: string, enum: [Active, OffDuty, Suspended] } }
      responses:
        "200":
          description: Paged driver list
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/PagedResponse' }
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/DriverResponse' }
        "400": { $ref: '#/components/responses/ValidationProblem' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Drivers]
      summary: Create driver
      description: >
        Creates a driver. fullName and licenseNumber are required; status defaults to Active.
        licenseNumber must be unique (409). userId optionally links a login user account —
        the user must exist (400) and may be linked to at most one driver (409).
      x-roles: [Admin, Dispatcher]
      operationId: createDriver
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DriverRequest' }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverResponse' }
        "400": { $ref: '#/components/responses/ValidationProblem' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "409": { $ref: '#/components/responses/Conflict' }
  /drivers/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [Drivers]
      summary: Get driver by id
      description: Returns a single driver. Responds 404 when the id does not exist.
      x-roles: [Admin, Dispatcher, Viewer]
      operationId: getDriver
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverResponse' }
        "404": { $ref: '#/components/responses/NotFound' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Drivers]
      summary: Update driver (full update)
      description: >
        Replaces full name, license number, phone, status and the optional user link.
        Responds 404 when the id does not exist, 409 when the license number collides with
        another driver or the target user is already linked to another driver.
      x-roles: [Admin, Dispatcher]
      operationId: updateDriver
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DriverRequest' }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverResponse' }
        "400": { $ref: '#/components/responses/ValidationProblem' }
        "404": { $ref: '#/components/responses/NotFound' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "409": { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Drivers]
      summary: Delete driver
      description: Hard delete in v1 (no soft-delete column). Responds 409 when the driver is referenced by a route (routes arrive in LOGI-0009).
      x-roles: [Admin]
      operationId: deleteDriver
      responses:
        "204": { description: Deleted }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }
  /shipments:
    get:
      tags: [Shipments]
      summary: List shipments (paged, filterable)
      description: >
        Returns a paged shipment list (F8). Filters combine with AND: status, priority,
        originWarehouseId, slaRisk (BR-2 at-risk projection) and q (referenceCode or
        destinationAddress contains, case-insensitive). Ordering defaults to createdAt
        descending; sort accepts createdAt, -createdAt, slaDueAt, -slaDueAt with a
        deterministic id tiebreak. Each item carries the read-time atRisk flag, which is
        never stored (Docs/business-rules/BR-sla-rules.md §2.5).
      x-roles: [Admin, Dispatcher, Viewer]
      operationId: listShipments
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1, minimum: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 25, minimum: 1, maximum: 100 } }
        - { name: status, in: query, description: "Filter by exact status (BR-7 enum)", schema: { type: string, enum: [Pending, Assigned, InTransit, Delivered, Delayed, Cancelled] } }
        - { name: priority, in: query, description: "Filter by exact priority", schema: { type: string, enum: [Standard, Express] } }
        - { name: originWarehouseId, in: query, description: "Filter by origin warehouse", schema: { type: integer, format: int64 } }
        - { name: slaRisk, in: query, description: "true = only at-risk shipments (BR-2); false = only the complement", schema: { type: boolean } }
        - { name: q, in: query, description: "Filter by referenceCode or destinationAddress (contains, case-insensitive)", schema: { type: string } }
        - { name: sort, in: query, description: "Sort key; prefix with - for descending (default -createdAt)", schema: { type: string, enum: [createdAt, -createdAt, slaDueAt, -slaDueAt], default: -createdAt } }
      responses:
        "200":
          description: Paged shipment list
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/PagedResponse' }
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/ShipmentResponse' }
        "400": { $ref: '#/components/responses/ValidationProblem' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Shipments]
      summary: Create shipment (BR-1 SLA due date)
      description: >
        Creates a shipment in status Pending (F5). The reference code (SHP-######) and
        sla_due_at are generated server-side: created_at + 48h for Standard, +12h for
        Express (BR-1). The initial Pending audit row is appended to
        shipment_status_history in the same transaction. An unknown originWarehouseId,
        a non-positive weightKg, a blank destinationAddress or an unknown priority
        respond 400.
      x-roles: [Admin, Dispatcher]
      operationId: createShipment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShipmentRequest' }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShipmentResponse' }
        "400": { $ref: '#/components/responses/ValidationProblem' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
  /shipments/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [Shipments]
      summary: Get shipment by id
      description: >
        Returns a single shipment in the same ShipmentResponse shape the list rows use, including the
        read-time atRisk projection (BR-2) and routeId (null until LOGI-0010). Responds 404 when the
        id does not exist. Driver access stays deferred with own-route scoping (LOGI-0009/0010),
        consistent with GET /shipments.
      x-roles: [Admin, Dispatcher, Viewer]
      operationId: getShipment
      responses:
        "200":
          description: The shipment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShipmentResponse' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Shipments]
      summary: Edit shipment fields (Pending only)
      description: >
        Partially updates the descriptive fields of a shipment that is still Pending (F6, BR-6/BR-7):
        originWarehouseId, destinationAddress, destinationLat/Lng and weightKg. The write is
        all-or-nothing — a rejected request leaves every column untouched and appends no audit row,
        because shipment_status_history records status transitions only (F7). Responds 400 with
        field-keyed errors (including errors.priority for the immutable priority), 403 for
        Viewer/Driver, 404 for an unknown id, and 409 when the shipment is no longer Pending.
      x-roles: [Admin, Dispatcher]
      operationId: updateShipment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShipmentUpdateRequest' }
      responses:
        "200":
          description: Updated — the shipment with its new values
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShipmentResponse' }
        "400": { $ref: '#/components/responses/ValidationProblem' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }
  /shipments/{id}/status-transitions:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      tags: [Shipments]
      summary: Transition shipment status (BR-7 state machine)
      description: |
        Moves a shipment to toStatus and appends an immutable entry to the audit trail
        (shipment_status_history) in one transaction. BR-7 legal transitions only:
          Pending → Assigned → InTransit → Delivered
          Pending → Cancelled, Assigned → Cancelled
          InTransit → Delayed, Delayed → InTransit
        Any other transition is rejected with 409; the ProblemDetails detail names the
        legal next state(s). No history row is written for rejected attempts.
        Note: the Driver role is declared here per BR-6 (own-route shipments only);
        ownership scoping is enforced from LOGI-0009/0010.
        BR-6 also makes cancellation a management action: toStatus "Cancelled" is rejected with
        403 for a Driver token (LOGI-0008), while the remaining Driver transitions keep the
        LOGI-0006 behaviour.
      x-roles: [Admin, Dispatcher, Driver]
      operationId: createShipmentStatusTransition
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatusTransitionRequest' }
      responses:
        "200":
          description: Transitioned — the recorded audit event is returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShipmentStatusEvent' }
        "400": { $ref: '#/components/responses/ValidationProblem' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }
  /shipments/{id}/status-history:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [Shipments]
      summary: Shipment status audit trail (paged, oldest first)
      description: >
        Returns the append-only status history of a shipment ordered oldest → newest.
        Responds 404 when the shipment id does not exist.
      x-roles: [Admin, Dispatcher, Driver, Viewer]
      operationId: listShipmentStatusHistory
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1, minimum: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 25, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: Paged history (oldest first)
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/PagedResponse' }
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/ShipmentStatusEvent' }
        "400": { $ref: '#/components/responses/ValidationProblem' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
  /routes:
    get:
      tags: [Routes]
      summary: List routes (paged, filterable)
      description: >
        Returns a paged route list (LOGI-0009). Filters combine with AND: status,
        vehicleId, driverId and q (name contains,
        case-insensitive). Sort defaults to -createdAt. Driver-role callers receive
        only their own routes (driverId = linked driver); cross-driver reads are 403.
      x-roles: [Admin, Dispatcher, Viewer, Driver]
      operationId: listRoutes
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1, minimum: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 25, minimum: 1, maximum: 100 } }
        - { name: q, in: query, description: "Filter by name (contains, case-insensitive)", schema: { type: string } }
        - { name: status, in: query, description: "Filter by exact status", schema: { type: string, enum: [Planned, InProgress, Completed, Cancelled] } }
        - { name: vehicleId, in: query, schema: { type: integer, format: int64 } }
        - { name: driverId, in: query, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: Paged route list
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/PagedResponse' }
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/RouteResponse' }
        "400": { $ref: '#/components/responses/ValidationProblem' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Routes]
      summary: Create route (+ optional vehicle/driver assignment)
      description: >
        Creates a route in status Planned (LOGI-0009). name (1..200) and the planned
        start/end window are required (plannedEnd after plannedStart); vehicleId/driverId
        are optional (omitted or null → unassigned lane). Unknown vehicleId/driverId
        respond 404; double-booking the same vehicle or driver on an overlapping window
        (BR-3/BR-4 interval overlap, Planned/InProgress) responds 409.
        Shipment assignment is LOGI-0010 — no shipment is touched here.
      x-roles: [Admin, Dispatcher]
      operationId: createRoute
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RouteRequest' }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouteResponse' }
        "400": { $ref: '#/components/responses/ValidationProblem' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }
  /routes/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [Routes]
      summary: Get route by id
      description: Returns a single route. Responds 404 when the id does not exist; a Driver token for another driver's route is 403.
      x-roles: [Admin, Dispatcher, Viewer, Driver]
      operationId: getRoute
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouteResponse' }
        "404": { $ref: '#/components/responses/NotFound' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Routes]
      summary: Assign / reassign vehicle/driver (Planned routes only)
      description: >
        Partial update of a Planned route (LOGI-0009): rename, reschedule, assign,
        reassign or unassign (explicit null) vehicle/driver. Unknown vehicleId/driverId
        respond 404; double-booking responds 409; non-Planned routes respond 409 and
        nothing is written. Server-owned fields (id, status, createdAt, updatedAt) are
        rejected with 400; an empty body is rejected with 400.
      x-roles: [Admin, Dispatcher]
      operationId: updateRoute
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RouteUpdateRequest' }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouteResponse' }
        "400": { $ref: '#/components/responses/ValidationProblem' }
        "404": { $ref: '#/components/responses/NotFound' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "409": { $ref: '#/components/responses/Conflict' }
  /routes/{id}/shipments:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    post:
      tags: [Routes]
      summary: Assign a shipment to the route (BR-5 capacity check)
      description: >
        Adds one shipment to a route and auto-transitions it Pending -> Assigned (PRD F10,
        LOGI-0010). Guards, each rejected atomically with nothing written: unknown route or
        shipment responds 404; a route that is not Planned responds 409 with the required status
        in the ProblemDetails detail; a shipment that is not Pending, or is already assigned to a
        different route, responds 409; adding the weight would exceed the assigned vehicle's
        capacityKg (BR-5) responds 409 with the assigned / adding / capacity numbers in the
        detail. A route with no vehicle assigned has no capacity to check and accepts the
        assignment. Re-assigning a shipment already on this route is an idempotent 200 no-op with
        no second history row. The capacity check and the write happen in one transaction and the
        running total is re-read inside it, so two concurrent boundary assigns cannot both win.
      x-roles: [Admin, Dispatcher]
      operationId: assignShipmentToRoute
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignShipmentToRouteRequest' }
      responses:
        "200":
          description: >
            Assigned — the shipment is returned with routeId set and status "Assigned", and one
            Pending -> Assigned entry was appended to its status history.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShipmentResponse' }
        "400": { $ref: '#/components/responses/ValidationProblem' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }
    get:
      tags: [Routes]
      summary: List the shipments assigned to a route (paged, with capacity projection)
      description: >
        Returns the route's assigned shipments (LOGI-0010) in the standard paged envelope plus a
        RouteCapacityView carrying assignedWeightKg, shipmentCount and the remaining capacity.
        capacityKg / vehicleId / remainingCapacityKg are null for a route with no vehicle. Driver
        tokens receive 200 only for a route assigned to their own linked driver and 403 for any
        other route (BR-6); Viewer is read-only. Responds 404 when the route id does not exist.
      x-roles: [Admin, Dispatcher, Viewer, Driver]
      operationId: listRouteShipments
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1, minimum: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 25, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: Paged route shipments with the BR-5 capacity projection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouteShipmentsPage' }
        "400": { $ref: '#/components/responses/ValidationProblem' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
  /routes/{id}/shipments/{shipmentId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      - { name: shipmentId, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
    delete:
      tags: [Routes]
      summary: Remove a shipment from the route (unassign)
      description: >
        Unassigns a shipment from a route (LOGI-0010): routeId is nulled, the shipment returns to
        status "Pending", one Assigned -> Pending entry is appended to its status history, and the
        freed weight is available again for the BR-5 check. BR-7 has no Assigned -> Pending edge,
        so this is a first-class unassign rather than a generic transition. Responds 404 when the
        route or shipment does not exist or the shipment is not on this route; 409 when the
        shipment has already left "Assigned" by another path (InTransit / Delivered / Cancelled).
      x-roles: [Admin, Dispatcher]
      operationId: removeShipmentFromRoute
      responses:
        "204": { description: Unassigned — the shipment is back to Pending with no route }
        "400": { $ref: '#/components/responses/ValidationProblem' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }
  /planning-board:
    get:
      tags: [Planning]
      summary: Get the planning board (read-only kanban aggregate)
      description: >
        Read-only aggregate for the dispatcher's planning board (LOGI-0011 / PRD F11): every BR-7
        status as a kanban column, the route cards with their BR-5 capacity projection, the applied
        filter set, and the count of unassigned shipments. One request replaces the dispatcher
        scanning a shipment list plus a route list plus a spreadsheet (BRD BO-3).
        All six columns are always returned in lifecycle order, including empty ones, and each
        column reports its UNTRUNCATED totalCount alongside the cards actually returned, with
        truncated set when maxPerColumn capped it. The default card order is slaDueAt ascending
        with id ascending as the tiebreak, so consecutive identical requests are stable.
        This endpoint is read-only in v1: a status transition (BR-7) and an assignment (BR-5)
        remain the job of their own endpoints, so BR-5 and BR-7 are enforced in exactly one place.
        Viewer is read-allowed like on every other v1 read; Driver is 403 because the board is
        org-wide while BR-6 scopes a Driver to their own route (see the LOGI-0011 O1 decision);
        anonymous is 401. Unknown routeId or warehouse id yields an empty result rather than 404 —
        the board is a filtered view, not a resource lookup.
      x-roles: [Admin, Dispatcher, Viewer]
      operationId: getPlanningBoard
      parameters:
        - { name: status, in: query, description: Restrict to one shipment status., schema: { type: string, enum: [Pending, Assigned, InTransit, Delivered, Delayed, Cancelled] } }
        - { name: priority, in: query, schema: { type: string, enum: [Standard, Express] } }
        - { name: originWarehouseId, in: query, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: slaRisk, in: query, description: Read-time BR-2 projection filter., schema: { type: boolean } }
        - { name: routeId, in: query, description: Restrict to one route; a null routeId is not implied., schema: { type: integer, format: int64, minimum: 1 } }
        - { name: q, in: query, description: Case-insensitive match on reference code or destination address., schema: { type: string, maxLength: 200 } }
        - { name: sort, in: query, schema: { type: string, enum: [slaDueAt, -slaDueAt, createdAt, -createdAt], default: slaDueAt } }
        - { name: maxPerColumn, in: query, schema: { type: integer, default: 50, minimum: 1, maximum: 200 } }
      responses:
        "200":
          description: The board — six columns, route cards with capacity, applied filters, unassigned count.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanningBoardResponse' }
        "400": { $ref: '#/components/responses/ValidationProblem' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
  /dashboard:
    get:
      tags: [Dashboard]
      summary: Get the operations dashboard (read-only aggregate)
      description: >
        Read-only aggregate for the manager's operational dashboard (LOGI-0012 / PRD F14, BRD BO-2):
        counts by shipment status, the SLA-at-risk list under the BR-2 projection, and the
        vehicle/driver utilization snapshot. One request replaces a fan-out of list endpoints and a
        spreadsheet, and the whole response is evaluated at a single captured instant (generatedAt),
        so atRiskTotalCount is always the totalCount of the at-risk page it carries (AC-3).
        All six BR-7 statuses are always present in statusCounts, zero counts included, and every
        count is the UNTRUNCATED number for the active filters. Utilization is the status-bucket
        count over the existing vehicle/driver enums plus a capacity-weighted percent; v1 has no
        duty-hour data, so no hours-worked figure is defined (LOGI-0012 O3).
        Every dashboard filter is also a GET /shipments filter, so each tile drills down into the
        existing list surface with no lossy translation (AC-6). There is no dashboard write in v1:
        status transitions (BR-7) and assignments (BR-5) keep their own endpoints, and at_risk is
        the read-time BR-2 projection, never a stored column (BR-sla-rules.md rule 2.5).
        Viewer is read-allowed like on every other v1 read; Driver is 403 because the dashboard is
        org-wide while BR-6 scopes a Driver to their own route (LOGI-0012 O1); anonymous is 401.
      x-roles: [Admin, Dispatcher, Viewer]
      operationId: getDashboard
      parameters:
        - { name: status, in: query, description: Restrict counts and the at-risk list to one shipment status., schema: { type: string, enum: [Pending, Assigned, InTransit, Delivered, Delayed, Cancelled] } }
        - { name: priority, in: query, schema: { type: string, enum: [Standard, Express] } }
        - { name: originWarehouseId, in: query, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: routeId, in: query, description: Restrict to one route; a null routeId is not implied., schema: { type: integer, format: int64, minimum: 1 } }
        - { name: page, in: query, schema: { type: integer, default: 1, minimum: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, default: 20, minimum: 1, maximum: 100 } }
      responses:
        "200":
          description: The dashboard — status counts, the SLA-at-risk page, vehicle and driver utilization.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardResponse' }
        "400": { $ref: '#/components/responses/ValidationProblem' }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
  /auth/login:
    post:
      tags: [Auth]
      summary: Issue access + refresh tokens
      description: >
        Authenticates an email/password pair and returns a short-lived access token plus a
        single-use refresh token. Anonymous endpoint. Invalid credentials return 401 without
        revealing whether the email exists (BR-driven anti-enumeration).
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        "200":
          description: Tokens issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        "400": { $ref: '#/components/responses/ValidationProblem' }
        "401": { $ref: '#/components/responses/Unauthorized' }
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate refresh token
      description: >
        Exchanges a valid refresh token for a NEW access token and a NEW refresh token. The
        presented token is revoked in the same operation (rotation), so replaying it fails with
        401. Anonymous endpoint — the refresh token itself is the credential.
      security: []
      operationId: refresh
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        "200":
          description: New token pair issued; the presented refresh token is revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        "400": { $ref: '#/components/responses/ValidationProblem' }
        "401": { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke a refresh token
      description: >
        Revokes the supplied refresh token so it can never be exchanged again. Idempotent from the
        caller's perspective: returns 204 and does not disclose whether the token existed.
      security: []
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        "204": { description: Refresh token revoked (or already unusable) }
        "400": { $ref: '#/components/responses/ValidationProblem' }
  /auth/me:
    get:
      tags: [Auth]
      summary: Current authenticated user
      description: >
        Returns the identity carried by the presented access token. Used by the SPA on start-up to
        restore session state and decide which UI affordances to render for the user's role.
      operationId: getCurrentUser
      x-roles: [Admin, Dispatcher, Driver, Viewer]
      responses:
        "200":
          description: Authenticated user's identity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthUser' }
        "401": { $ref: '#/components/responses/Unauthorized' }
security:
  - BearerAuth: []
