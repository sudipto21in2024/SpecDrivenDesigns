name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Build backend
        run: dotnet build src/backend/LogiFlow.sln --no-incremental -c Release

      - name: Test backend
        run: dotnet test src/backend/LogiFlow.sln --no-build -c Release --collect:"XPlat Code Coverage" --results-directory test-results
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1

      - name: Install frontend dependencies
        run: npm ci --prefix src/frontend

      - name: Build frontend
        run: npm --prefix src/frontend run build

      - name: Test frontend
        run: npm --prefix src/frontend run test

      - name: Lint OpenAPI contract
        run: npx --yes @stoplight/spectral@6 lint contracts/v1-openapi.yaml

  e2e:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build backend
        run: dotnet build src/backend/LogiFlow.sln -c Release

      - name: Install frontend dependencies
        run: npm ci --prefix src/frontend

      - name: Install E2E dependencies
        run: npm ci --prefix tests/e2e

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: tests/e2e

      - name: Run E2E tests
        working-directory: tests/e2e
        env:
          CI: 'true'
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 7
