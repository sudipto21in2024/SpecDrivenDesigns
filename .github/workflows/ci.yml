name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Build backend
        run: dotnet build src/backend/LogiFlow.sln --no-incremental -c Release

      - name: Test backend
        run: dotnet test src/backend/LogiFlow.sln --no-build -c Release --collect:"XPlat Code Coverage" --results-directory test-results
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1

      - name: Install frontend dependencies
        run: npm ci --prefix src/frontend

      - name: Build frontend
        run: npm --prefix src/frontend run build

      - name: Test frontend
        run: npm --prefix src/frontend run test

      # Spectral resolves the ruleset from the WORKING DIRECTORY, not from the
      # linted document's location. Running from the repo root therefore found no
      # ruleset and exited non-zero. Pass --ruleset explicitly so contracts/.spectral.yaml
      # (extends spectral:oas, see ADR-001) is always applied, matching local runs.
      - name: Lint OpenAPI contract
        run: npx --yes @stoplight/spectral-cli lint contracts/v1-openapi.yaml --ruleset contracts/.spectral.yaml

  e2e:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build backend
        run: dotnet build src/backend/LogiFlow.sln -c Release

      - name: Install frontend dependencies
        run: npm ci --prefix src/frontend

      - name: Install E2E dependencies
        run: npm ci --prefix tests/e2e

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: tests/e2e

      - name: Run E2E tests
        working-directory: tests/e2e
        env:
          CI: 'true'
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          retention-days: 7

      # The API runs as a Playwright webServer, so its stdout never reaches the run log (only the
      # frontend server's output does). Serilog's rolling file log holds the exception behind any
      # HTTP 5xx, and the throwaway database preserves the state that caused it — without these
      # artifacts a failing e2e run is undiagnosable from CI alone (LOGI-0013).
      - name: Upload API logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-logs
          path: |
            src/backend/LogiFlow.Api/Logs
            src/backend/LogiFlow.Api/e2e-logiflow.db*
          retention-days: 7
