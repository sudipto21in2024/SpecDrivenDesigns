# LogiFlow SPA serving. Static assets from the Vite build; /api is reverse-proxied
# to the API service so the SPA keeps using its relative /api/v1 paths (single origin,
# no CORS, no API URL baked into the bundle at build time).

upstream logiflow_api {
    # `api` is the compose service name (Docker's embedded DNS resolves it on the
    # default compose network).
    server api:8080;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the nginx version.
    server_tokens off;

    # Hashed build assets under /assets are immutable — cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API traffic goes to the ASP.NET Core service. Authorization and refresh-token
    # headers are long-lived and per-user, so responses must not be cached by a proxy.
    location /api/ {
        proxy_pass http://logiflow_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA fallback: React Router owns client-side routing, so unknown paths must
    # still return index.html rather than a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html itself must never be cached, or clients pin an old asset manifest.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;
}